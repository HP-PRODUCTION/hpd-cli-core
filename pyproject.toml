[project]
name = "HPD-CORE"
version = "0.1.0"
description = "HPD Control Plane CLI"
authors = [{name = "HPD Architect"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=10.0.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=1.4.0",
    "python-dotenv>=0.19.0",
    "requests>=2.26.0",
    "psutil>=5.9.0",
    "google-genai>=1.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.20.0",
    "alembic>=1.13.0",
    "argcomplete>=3.6.0",
    "psycopg2-binary>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0"
]

[project.scripts]
hpd = "hpd_cli.cli:main"

[tool.setuptools.packages.find]
include = ["hpd_cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
