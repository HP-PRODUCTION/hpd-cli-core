version: '3.8'

services:
  hpd-cli-core:
    build: .
    container_name: hpd-cli-core
    command: uvicorn hpd_cli.api.main:app --host 0.0.0.0 --port 3001 --reload
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
    environment:
      HPD_UI_TOKEN: "devtoken"
    restart: unless-stopped
